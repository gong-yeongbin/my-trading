db_path: data/market.db

kis:
  trade_env: demo    # 매매·잔고 서버. 시세 수집은 항상 실전 서버(KIS_REAL_*)
  token_cache: data/token_real.json       # 시세용 실전
  trade_token_cache: data/token_demo.json # 매매용
  requests_per_second: 0       # 0 이면 15 (실전)
  # 시세용 앱키는 .env 의 KIS_REAL_*. 매매용 앱키는 trade_env 에 따라 KIS_DEMO_* / KIS_REAL_*. TUI 설정 메뉴에서 입력 가능

ls:
  base_url: https://openapi.ls-sec.co.kr:8080
  ws_url: wss://openapi.ls-sec.co.kr:9443/websocket
  # 앱키는 .env 의 LS_APP_KEY, LS_APP_SECRET. 없으면 뉴스·지수 줄은 "미연결"
  token_cache: data/ls_token.json

log:
  file: data/trader.log

universe:
  markets: [kospi, kosdaq]
  group_codes: [ST]
  exclude_flags: [거래정지, 정리매매, 관리종목, 시장경고, 단기과열, 이상급등, SPAC]

fetch:
  start_date: "2025-09-01"     # 1차(선별 전용): 60일선용 1년치. 백테스트 시 2021-01-01 로 되돌리고 봉을 비운 뒤 재수집
  daily_at: "02:00"          # TUI 자동 수집 시각 (KST). 전날 봉을 새벽에 받는다

strategy:
  index_ma_days: 20
  min_turnover: 10000000000
  turnover_ma_days: 20
  turnover_ratio_min: 3.0
  close_to_high_min: 0.99
  change_min: 0.03
  change_max: 0.20
  ma_short_days: 20
  ma_long_days: 60
  new_high_days: 20
